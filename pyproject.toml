[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "simplymarkdown"
version = "2.0.0"
description = "An opinionated, extensible Markdown static-site generator"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Cemre Efe Karakas" }]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "Jinja2>=3.1,<4",
  "Markdown>=3.5,<4",
  "MarkupSafe>=2.1,<4",
  "Pygments>=2.16,<3",
]

[project.urls]
Repository = "https://github.com/cemreefe/SimplyMarkdown"

[project.scripts]
simplymarkdown = "simplymarkdown.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "ruff>=0.11,<1",
  "types-Markdown>=3.7,<4",
]

[tool.setuptools]
packages = ["simplymarkdown"]

[tool.setuptools.package-data]
simplymarkdown = ["*.html", "*.css"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "FURB", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
